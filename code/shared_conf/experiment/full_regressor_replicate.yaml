# @package _global_
# CONTROL. Scalar XCO2 regressor, identical to full_regressor_grouped.yaml except that it
# trains on the original replicate-level split. See
# full_regressor_profiles_last4_replicate.yaml for why the control set exists.
#
# Omitting the `defaults: override /data: local_simulated_grouped` line is what selects the
# replicate split: data.split_csv and data.stats_dir stay unset, so train.py draws
# validation with random_split and standardises with the legacy constants -- the setup the
# published checkpoint was trained under.
#
# Run:
#   condor_submit train.sub -a 'job_name = det_xco2_replicate' -a 'gpu_length = short'
hyps:
  model: full_regressor
  seed: 42
  embed_dim: 512
  nhead: 4
  nlayers: 1
  aux_dim: 32
  lr: 6.471796937675714e-05
  wd: 4.772666391106017e-06
  epochs: 25

model:
  embed_dim: ${hyps.embed_dim}
  nhead: ${hyps.nhead}
  nlayers: ${hyps.nlayers}
  aux_dim: ${hyps.aux_dim}

data:
  seed: ${hyps.seed}
  weight_path: /workspace/project/experiments/weights/replicate_control/full_regressor

hydra:
  run:
    dir: ${data.weight_path}/runs/${now:%Y%m%d_%H%M%S}
