# @package _global_
# Deterministic scalar XCO2 regressor on the reference-sounding-disjoint split.
# Single run with fixed hyperparameters (no Bayesian optimization), so that any change
# relative to the published numbers is attributable to the split alone.
#
# Hyperparameters are taken from the checkpoint that produced the published results,
# weights/full_regressor/global_best/best_hparams.yaml.
# !! These differ from the "Deterministic / XCO2" row of Table A1, which reports
#    E=256, H=8, L=4, lr=3.00e-4, wd=3.00e-4. Table A1 needs correcting.
#
# Run:
#   python3 experiments/train/train.py +experiment=full_regressor_grouped
# (the defaults list below already switches the data group; if your Hydra version
#  rejects the override, add `data=local_simulated_grouped` on the command line)
defaults:
  - override /data: local_simulated_grouped

hyps:
  model: full_regressor
  seed: 42
  embed_dim: 512
  nhead: 4
  nlayers: 1
  aux_dim: 32
  lr: 6.471796937675714e-05
  wd: 4.772666391106017e-06
  epochs: 25

model:
  embed_dim: ${hyps.embed_dim}
  nhead: ${hyps.nhead}
  nlayers: ${hyps.nlayers}
  aux_dim: ${hyps.aux_dim}

data:
  seed: ${hyps.seed}
  weight_path: /workspace/project/experiments/weights/group_split_v1/full_regressor

hydra:
  run:
    dir: ${data.weight_path}/runs/${now:%Y%m%d_%H%M%S}
