# @package _global_
# Conditional flow for the 20-level profile on the replicate-level split, with covariates.
#
# GENERATED TWIN of code/shared_conf/experiment/nf_profiles_cov_grouped.yaml. The two configs are identical
# except for the split they read: the table, the statistics directory and the weights
# directory. Nothing about the architecture, the optimizer, the epoch count or the
# covariate preset differs, because the whole purpose of this file is to make "the split"
# the only difference between two columns of the revision's main table.
#
# code/test/test_replicate_configs.py asserts that, key by key. If you change a
# hyperparameter here, change it in the grouped twin too or the test will say so.
#
# The split is the ORIGINAL replicate-level partition, written out as a table by
# experiments/pipelines/make_replicate_split.py: every reference sounding appears in all
# three partitions, and the test partition is exactly the published one. This is the
# within-reference interpolation experiment reported as the secondary result -- trained with the
# corrected covariates and the same search protocol as the group split, so that the pair
# is a controlled comparison rather than two unrelated runs.

covariates: scene_prior

data:
  root: /workspace/project/scratch/simulated/files
  annotations: aux_data.csv
  train_batch_size: 128
  val_batch_size: 256
  seed: 42
  # NOTE: train_nf_profiles.py reads data.stats_dir unconditionally; nf_profiles.yaml
  # omits it, which raises KeyError. Kept explicit here.
  stats_dir: /workspace/project/experiments/pipelines/stats/replicate_split_v1
  split_csv: /workspace/project/scratch/simulated/files/splits/replicate_split_v1_cov.csv

model:
  # FullRegressorProfiles (context backbone)
  aux_dim: 32
  embed_dim: 256
  nhead: 8
  nlayers: 1
  out_dim: 20

nflow:
  # From best_flow_profiles.pt's stored cfg; see the header. Do not "restore" these from
  # nf_profiles.yaml -- those are the BO search defaults, not the trained model.
  layers: 9
  hidden: 384
  bins: 10
  tail_bound: 8.391013429624302
  standardize_y: false
  # The spline clamps are NOT in the checkpoint -- the old save_checkpoint did not store
  # them -- so these come from nf_profiles.yaml, which is the
  # config the search ran under and is the best record there is. BO tuned
  # layers/hidden/bins/tail_bound; there is no sign it touched these.
  min_bin_width: 0.005
  min_bin_height: 0.005
  min_derivative: 0.01

optim:
  lr: 5.0e-4
  wd: 1.0e-5
  epochs: 35
  grad_clip: 1.0

eval:
  rmse_samples: 0

setup:
  freeze_backbone: false
  # Warm start from the deterministic profile model trained on THIS split.
  backbone_ckpt: /workspace/project/experiments/weights/replicate_split_v1/full_regressor_profiles_scene_prior_ppm/net_profiles.pt

weights_dir: /workspace/project/experiments/weights/replicate_split_v1/flow_regressor_profiles

bo:
  enabled: false
