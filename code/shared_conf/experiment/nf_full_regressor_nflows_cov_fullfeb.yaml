# @package _global_
# Conditional normalizing flow over XCO2, trained on ALL of February.
#
# GENERATED TWIN of code/shared_conf/experiment/nf_full_regressor_nflows_cov_grouped.yaml, differing only in the split:
# `group_split_v1` -> `full_feb_v1` everywhere it names a table, a statistics directory or
# a weights tree. code/test/test_replicate_configs.py asserts that key by key, so the two
# stay a controlled pair or the tests fail.
#
# The partition is the whole difference. `full_feb_v1` is `group_split_v1` with its test
# scenes folded back into training -- 406 reference soundings instead of 361, 40,492 spectra
# instead of 36,003 -- because once March and July are the test set, holding 45 February
# scenes back costs accuracy and buys nothing.
#
# The 45 validation scenes are unchanged. They are what the search ranked these
# configurations on, and what predict.py calibrates the Laplace's aleatoric diagonal on at
# scoring time; calibrating that in-sample would make the baseline's intervals optimistically
# narrow. See experiments/pipelines/make_full_feb_split.py.
#
# Nothing here is a searched hyperparameter. chtc/bo_final.sh overrides those from
# bo_<study>_best.json, the winner of the group-split search, which is what makes this the
# same configuration on more data rather than a second search.
#
# Run (via the DAG, which sets OCO2_SPLIT=full_feb_v1):
#   condor_submit_dag chtc/months_full.dag

covariates: scene_prior

data:
  root: /workspace/project/scratch/simulated/files
  annotations: aux_data.csv
  train_batch_size: 128
  val_batch_size: 256
  seed: 42
  train_size: 0.9          # ignored when split_csv is set (val comes from the table)
  stats_dir: /workspace/project/experiments/pipelines/stats/full_feb_v1
  split_csv: /workspace/project/scratch/simulated/files/splits/full_feb_v1_cov.csv
  # What this flow models. `xco2` is the column average -- the quantity Table 1 is about,
  # and the one its Laplace and ACOS rows report.
  #
  # train_nf.py's default is `surface`, which is what it has always silently done: load the
  # PROFILE dataset and take level 20. That made Table 1's NF row a different target from
  # its other two rows, standardized by a different constant, on differently preprocessed
  # inputs.
  #
  # Set explicitly here rather than relying on the default, because the default is chosen
  # to preserve old behaviour, not to be correct.
  target: xco2

weights_dir: /workspace/project/experiments/weights/full_feb_v1/flow_regressor_nflow

bo:
  enabled: false

model_cfg_obj:
  full_backbone:
    aux_dim: 32
    embed_dim: 256
    nhead: 8
    nlayers: 1
  nflow:
    hidden: 384
    layers: 5
    bins: 9
    tail_bound: 6.3108919641

optim:
  lr: 4.533555957493404e-04
  wd: 5.387680934037755e-04
  epochs: 35        # was 50; the checkpoint's extra says 35
  grad_clip: 1.0

setup:
  freeze_backbone: false
  backbone_ckpt: null
