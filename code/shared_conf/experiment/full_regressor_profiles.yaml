# @package _global_
defaults:
  - model: full_regressor_profiles
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: tpe

task: profiles
target_indices: last4
weights_dir: /workspace/project/experiments/weights/full_regressor_profiles_last4_bo

hyps:
  model: full_regressor_profiles
  seed: 42
  embed_dim: 256
  nhead: 8
  nlayers: 1
  aux_dim: 32
  lr: 3e-4
  wd: 3e-4
  epochs: 40

model:
  embed_dim: ${hyps.embed_dim}
  nhead: ${hyps.nhead}
  nlayers: ${hyps.nlayers}
  aux_dim: ${hyps.aux_dim}
  out_dim: 4

data:
  seed: ${hyps.seed}

hydra:
  mode: MULTIRUN
  run:
    dir: /workspace/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: /workspace/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  sweeper:
    sampler:
      seed: 123
    direction: minimize
    study_name: full_profiles_last4_bo_loop
    storage: null
    n_trials: 100
    n_jobs: 1
    params:
      hyps.lr: tag(log, interval(1e-4, 3e-3))
      hyps.wd: tag(log, interval(1e-6, 1e-3))
      hyps.embed_dim: choice(128, 256, 384, 512)
      hyps.nlayers: choice(1, 2, 3)
      hyps.nhead: choice(4, 8)
      hyps.aux_dim: choice(16, 32, 64)