# @package _global_
defaults:
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: tpe

hyps:
  model: full_regressor
  seed: 42
  embed_dim: 256
  nhead: 8
  nlayers: 1
  aux_dim:  32
  lr: 3e-4
  wd: 3e-4
  epochs: 25

model:
  embed_dim: ${hyps.embed_dim}
  nhead: ${hyps.nhead}
  nlayers: ${hyps.nlayers}
  aux_dim:  ${hyps.aux_dim}

data:
  seed: ${hyps.seed}
  weight_path: /workspace/project/experiments/weights/full_regressor

hydra:
  run:
    dir: ${data.weight_path}/runs/${now:%Y%m%d_%H%M%S}/${hydra.job.num}
  sweeper:
    sampler:
      seed: 123
    direction: minimize
    study_name: full_model_bo_loop
    storage: null
    n_trials: 100
    n_jobs: 1

    params:
      hyps.lr: tag(log, interval(1e-5, 1e-2))
      hyps.wd: tag(log, interval(1e-6, 1e-2))
      hyps.nlayers: range(1,2,step=1)
      hyps.nhead: range(4,8,step=4)
      hyps.embed_dim: range(128,512,step=128)