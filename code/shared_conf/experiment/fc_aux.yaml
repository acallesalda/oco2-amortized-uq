# @package _global_
defaults:
  - override /model: fully_connected_aux
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: tpe

hyps:
  model: fully_connected_aux
  seed: 42
  embed_dim: 256
  lr: 3e-4
  wd: 3e-4
  epochs: 25

model:
  embed_dim: ${hyps.embed_dim}

data:
  seed: ${hyps.seed}
  weight_path: /workspace/project/experiments/weights/fully_connected_aux

hydra:

  sweeper:
    sampler:
      seed: 123
    direction: minimize
    study_name: fc_aux_bo_loop
    storage: null
    n_trials: 100
    n_jobs: 1

    params:
      hyps.lr: tag(log, interval(1e-5, 1e-2))
      hyps.wd: tag(log, interval(1e-6, 1e-2))
      hyps.embed_dim: range(128,512,step=128)