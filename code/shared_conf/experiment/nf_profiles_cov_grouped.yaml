# @package _global_
# nf_profiles, on the reference-sounding-disjoint split WITH the recovered covariates.
#
# Generated from nf_profiles_grouped.yaml by changing exactly three things:
#
#   covariates:      the preset the deterministic backbone was trained with. It sets the
#                    auxiliary encoder's shape, so it MUST match the backbone or the
#                    warm-start silently drops the aux weights -- train_nf_profiles.py
#                    raises rather than letting that happen.
#   data.split_csv:  the augmented annotations table, which carries the corrected scene
#                    metadata (*_fix) and the priors the pipeline never read.
#   backbone_ckpt:   the covariate-trained backbone rather than the legacy one.
#
# Everything else -- flow architecture, optimizer, epochs -- is untouched, so a comparison
# against nf_profiles_grouped.yaml isolates the covariates.
#
# Run:
#   python3 experiments/train/train_nf_profiles.py --exp_cfg code/shared_conf/experiment/nf_profiles_cov_grouped.yaml

# The covariate set. Must equal the backbone's.
covariates: scene_prior

data:
  root: /workspace/project/scratch/simulated/files
  annotations: aux_data.csv
  train_batch_size: 128
  val_batch_size: 256
  seed: 42
  # NOTE: train_nf_profiles.py reads data.stats_dir unconditionally; nf_profiles.yaml
  # omits it, which raises KeyError. Kept explicit here.
  stats_dir: /workspace/project/experiments/pipelines/stats/group_split_v1
  split_csv: /workspace/project/scratch/simulated/files/splits/group_split_v1_cov.csv

model:
  # FullRegressorProfiles (context backbone)
  aux_dim: 32
  embed_dim: 256
  nhead: 8
  nlayers: 1
  out_dim: 20

nflow:
  # From best_flow_profiles.pt's stored cfg; see the header. Do not "restore" these from
  # nf_profiles.yaml -- those are the BO search defaults, not the trained model.
  layers: 9
  hidden: 384
  bins: 10
  tail_bound: 8.391013429624302
  standardize_y: false
  # The spline clamps are NOT in the checkpoint -- the old save_checkpoint did not store
  # them -- so these come from nf_profiles.yaml, which is the
  # config the search ran under and is the best record there is. BO tuned
  # layers/hidden/bins/tail_bound; there is no sign it touched these.
  min_bin_width: 0.005
  min_bin_height: 0.005
  min_derivative: 0.01

optim:
  lr: 5.0e-4
  wd: 1.0e-5
  epochs: 35
  grad_clip: 1.0

eval:
  rmse_samples: 0

setup:
  freeze_backbone: false
  # Warm start from the deterministic profile model trained on THIS split.
  backbone_ckpt: /workspace/project/experiments/weights/group_split_v1/full_regressor_profiles_scene_prior_ppm/net_profiles.pt

weights_dir: /workspace/project/experiments/weights/group_split_v1/flow_regressor_profiles

bo:
  enabled: false
