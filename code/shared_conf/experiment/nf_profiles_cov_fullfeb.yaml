# @package _global_
# Conditional normalizing flow over the 20-level profile, trained on ALL of February.
#
# GENERATED TWIN of code/shared_conf/experiment/nf_profiles_cov_grouped.yaml, differing only in the split:
# `group_split_v1` -> `full_feb_v1` everywhere it names a table, a statistics directory or
# a weights tree. code/test/test_replicate_configs.py asserts that key by key, so the two
# stay a controlled pair or the tests fail.
#
# The partition is the whole difference. `full_feb_v1` is `group_split_v1` with its test
# scenes folded back into training -- 406 reference soundings instead of 361, 40,492 spectra
# instead of 36,003 -- because once March and July are the test set, holding 45 February
# scenes back costs accuracy and buys nothing.
#
# The 45 validation scenes are unchanged. They are what the search ranked these
# configurations on, and what predict.py calibrates the Laplace's aleatoric diagonal on at
# scoring time; calibrating that in-sample would make the baseline's intervals optimistically
# narrow. See experiments/pipelines/make_full_feb_split.py.
#
# Nothing here is a searched hyperparameter. chtc/bo_final.sh overrides those from
# bo_<study>_best.json, the winner of the group-split search, which is what makes this the
# same configuration on more data rather than a second search.
#
# Run (via the DAG, which sets OCO2_SPLIT=full_feb_v1):
#   condor_submit_dag chtc/months_full.dag

covariates: scene_prior

data:
  root: /workspace/project/scratch/simulated/files
  annotations: aux_data.csv
  train_batch_size: 128
  val_batch_size: 256
  seed: 42
  # NOTE: train_nf_profiles.py reads data.stats_dir unconditionally; nf_profiles.yaml
  # omits it, which raises KeyError. Kept explicit here.
  stats_dir: /workspace/project/experiments/pipelines/stats/full_feb_v1
  split_csv: /workspace/project/scratch/simulated/files/splits/full_feb_v1_cov.csv

model:
  # FullRegressorProfiles (context backbone)
  aux_dim: 32
  embed_dim: 256
  nhead: 8
  nlayers: 1
  out_dim: 20

nflow:
  # From best_flow_profiles.pt's stored cfg; see the header. Do not "restore" these from
  # nf_profiles.yaml -- those are the BO search defaults, not the trained model.
  layers: 9
  hidden: 384
  bins: 10
  tail_bound: 8.391013429624302
  standardize_y: false
  # The spline clamps are NOT in the checkpoint -- the old save_checkpoint did not store
  # them -- so these come from nf_profiles.yaml, which is the
  # config the search ran under and is the best record there is. BO tuned
  # layers/hidden/bins/tail_bound; there is no sign it touched these.
  min_bin_width: 0.005
  min_bin_height: 0.005
  min_derivative: 0.01

optim:
  lr: 5.0e-4
  wd: 1.0e-5
  epochs: 35
  grad_clip: 1.0

eval:
  rmse_samples: 0

setup:
  freeze_backbone: false
  # Warm start from the deterministic profile model trained on THIS split.
  backbone_ckpt: /workspace/project/experiments/weights/full_feb_v1/full_regressor_profiles_scene_prior_ppm/net_profiles.pt

weights_dir: /workspace/project/experiments/weights/full_feb_v1/flow_regressor_profiles

bo:
  enabled: false
