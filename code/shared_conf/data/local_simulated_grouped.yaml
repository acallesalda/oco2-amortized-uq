# Reference-sounding-disjoint split of the simulated OCO-2 data.
#
# Same paths as local_simulated.yaml, but train/val/test are read from a precomputed
# split table in which whole reference soundings (not individual replicates) are assigned
# to a partition. Build it with:
#   python3 experiments/pipelines/make_group_split.py
#   python3 experiments/pipelines/compute_split_stats.py --split-csv <split_csv>
#
# Select with `data=local_simulated_grouped` on the Hydra command line.
# See local_simulated.yaml for the root / out_root split.
root: /workspace/data/oco2/simulated
out_root: /workspace/project/scratch/simulated

soundings: ${data.root}/og_data
tree: ${data.root}/tree

clean_tree: ${data.out_root}/tree/clean_oco2
files: ${data.out_root}/files
annotations: "aux_data.csv"
weight_path: ${data.out_root}/weights

# Group split table, and the statistics estimated from ITS training soundings only.
split_csv: ${data.files}/splits/group_split_v1.csv
stats_dir: /workspace/project/experiments/pipelines/stats/group_split_v1

seed: 42
train_batch_size: 512
val_batch_size: 4096

# Cluster-balanced sampling. Declared here (rather than only on the command line) because
# Hydra composes in struct mode: an override of a key that no config declares is a hard
# error, and `data.balance_by=clst` therefore killed every deterministic trainer in the
# first balanced run before a single epoch. null = off, i.e. published behaviour.
# alpha tempers it: 0 = off, 1 = full inverse frequency, 0.5 = square root.
balance_by: null
balance_alpha: 0.5
