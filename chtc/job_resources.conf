# Resources for the jobs that unpack the dataset.
#
# Included by prep, interactive, train, train_dep, eval and interactive-eval -- everything
# that untars the 43k .npy files onto the execute node's local disk. Every one of those
# uses all three macros below, which is what keeps condor_submit quiet; see the note in
# site.conf.
#
# Not included by audit.sub (reads seven checkpoints, wants 8 GB), reprocess.sub (rebuilds
# from raw .h5, wants 100 GB and 48 GB of memory) or build-container.sub (wants a 64 GB
# scratch for the image build). Those three size themselves, and say so where they do it.

# The dataset is 43k individual .npy files read one per __getitem__, so the DataLoader
# workers are doing real filesystem work; give them cores. prep does not need four, but it
# is a ten-minute job on the CPU pool and one shared number is worth more than the
# two cores.
CPUS         = 4
MEM_GB       = 24

# The container, two tarballs, 43k extracted files and the checkpoints all live in the
# job scratch directory together.
DISK_GB      = 40
