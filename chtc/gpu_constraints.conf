# Which GPUs this image can actually drive.
#
# Included by every job that asks for a GPU: interactive, interactive-eval, train,
# train_dep, eval. prep and audit are CPU-only and do not take this file.
#
# These three are one coupled decision, tied to the torch version in requirements.txt.
# They lived verbatim in five submit files, which is five chances to edit four.

# The cu121 wheels carry SASS for sm_50 through sm_90. Without the upper bound the
# matchmaker will hand us a Blackwell card the image cannot use, and the job dies on the
# first kernel launch -- after having already spent ten minutes untarring data. Raising
# torch to reach newer cards moves the numerics, so it is a decision for a person, not a
# default to drift.
GPU_MIN_CAP  = 7.0
GPU_MAX_CAP  = 9.0

# The unit suffix is required. Without it condor_submit warns
#   "gpus_minimum_memory=16000 defaults to megabytes, but should contain a units suffix"
# and, more to the point, a reader has to know that default to know what is being asked
# for. Written as 16000M rather than 16G on purpose: HTCondor's G is binary, so 16G would
# be 16384M and match a slightly narrower pool than the published runs did.
GPU_MIN_MEM  = 16000M
